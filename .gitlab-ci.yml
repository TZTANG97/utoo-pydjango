# .gitlab-ci.yml — Utoo 微服务红绿双实例发版（与 EMKU 无关）
# Runner tag：utoo-windows（须为本项目单独注册，否则会 stuck）
#
# Stages（4 段）：
#   build           → 构建统一前端 qd_web_front
#   deploy_services → 空闲槽：qd_libs_common + 4 上游
#   deploy_gateway  → 空闲槽网关 + health + utoo-switch-active.sh 切流
#   deploy_static   → 切流后再发 /var/www/utoo-web
#
# 禁止复用 emku-windows /opt/emku-* / emku_upstream_*
stages:
  - build
  - deploy_services
  - deploy_gateway
  - deploy_static

variables:
  GIT_STRATEGY: fetch
  GIT_CLEAN_FLAGS: "-ffd"
  UTOO_STATIC_WEB: "/var/www/utoo-web"
  UTOO_SHARED_CONFIG: "/opt/utoo/config"
  UTOO_UPSTREAM_CONF: "/usr/local/nginx/conf/utoo_upstream_server.conf"
  UTOO_SWITCH_SCRIPT: "/usr/local/sbin/utoo-switch-active.sh"
  # 兼容旧变量名
  UTOO_STATIC_C: "/var/www/utoo-web"
  UTOO_STATIC_ADMIN: "/var/www/utoo-web"

.windows_ci_clear_ssh_known_hosts:
  variables:
    SSH_KNOWN_HOSTS: ""
    SSH_KNOWN_HOSTS_DEV: ""
    SSH_KNOWN_HOSTS_PROD: ""

.utoo_windows_runner:
  extends: .windows_ci_clear_ssh_known_hosts
  tags:
    - utoo-windows

# --- build ---

build_frontend_dev:
  extends: .utoo_windows_runner
  stage: build
  only:
    - dev
  except:
    - merge_requests
  when: manual
  allow_failure: false
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "deploy/utoo-windows/ci-build-frontend.ps1"
  artifacts:
    paths:
      - qd_web_front/dist/
    expire_in: 2 hours

build_frontend_prod:
  extends: .utoo_windows_runner
  stage: build
  only:
    - prod
  except:
    - merge_requests
  when: manual
  allow_failure: false
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "deploy/utoo-windows/ci-build-frontend.ps1"
  artifacts:
    paths:
      - qd_web_front/dist/
    expire_in: 2 hours

# --- deploy_services：4 上游（auth/wx 已废弃） ---

deploy_services_dev:
  extends: .utoo_windows_runner
  stage: deploy_services
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: libs_services
  needs:
    - build_frontend_dev
  when: manual
  allow_failure: false
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "deploy/utoo-windows/ci-deploy-windows.ps1"

deploy_services_prod:
  extends: .utoo_windows_runner
  stage: deploy_services
  only:
    - prod
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: prod
    UTOO_DEPLOY_PHASE: libs_services
  needs:
    - build_frontend_prod
  when: manual
  allow_failure: false
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "deploy/utoo-windows/ci-deploy-windows.ps1"

# --- deploy_gateway ---

deploy_gateway_dev:
  extends: .utoo_windows_runner
  stage: deploy_gateway
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: gateway
  needs:
    - job: deploy_services_dev
      artifacts: false
    - job: build_frontend_dev
      artifacts: true
  when: on_success
  allow_failure: false
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "deploy/utoo-windows/ci-deploy-windows.ps1"

deploy_gateway_prod:
  extends: .utoo_windows_runner
  stage: deploy_gateway
  only:
    - prod
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: prod
    UTOO_DEPLOY_PHASE: gateway
  needs:
    - job: deploy_services_prod
      artifacts: false
    - job: build_frontend_prod
      artifacts: true
  when: on_success
  allow_failure: false
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "deploy/utoo-windows/ci-deploy-windows.ps1"

# --- deploy_static ---

deploy_static_dev:
  extends: .utoo_windows_runner
  stage: deploy_static
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: static
  needs:
    - job: deploy_gateway_dev
      artifacts: false
    - job: build_frontend_dev
      artifacts: true
  when: on_success
  allow_failure: false
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "deploy/utoo-windows/ci-deploy-windows.ps1"

deploy_static_prod:
  extends: .utoo_windows_runner
  stage: deploy_static
  only:
    - prod
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: prod
    UTOO_DEPLOY_PHASE: static
  needs:
    - job: deploy_gateway_prod
      artifacts: false
    - job: build_frontend_prod
      artifacts: true
  when: on_success
  allow_failure: false
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "deploy/utoo-windows/ci-deploy-windows.ps1"
