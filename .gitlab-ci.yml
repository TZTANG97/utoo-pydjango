# .gitlab-ci.yml — Utoo 微服务红绿双实例发版（与 EMKU 无关）
# Runner tag：utoo-windows（须为本项目单独注册，否则会 stuck）
#
# 每个环境有 6 个独立手动发布入口：
# order / payment / admin_asset / admin_platform / gateway / frontend
# 前四者按各自 upstream 的空闲蓝绿实例发布并切流；gateway 独立切公网入口。
#
# Runner shell 已是 powershell。
# 注意：勿写 $env:CI_*（GitLab 会先展开 $env 为空，导致 :CI_* / UnexpectedToken，并落到 Runner 安装目录）。
# 用 '$CI_PROJECT_DIR' 让 GitLab 注入路径；其余 PowerShell 变量写成 $$xxx。
# 禁止复用 emku-windows /opt/emku-* / emku_upstream_*
stages:
  - deploy

variables:
  GIT_STRATEGY: fetch
  GIT_CLEAN_FLAGS: "-ffd"
  UTOO_STATIC_WEB: "/var/www/utoo-web"
  UTOO_SHARED_CONFIG: "/opt/utoo/config"
  UTOO_UPSTREAM_CONF: "/usr/local/nginx/conf/utoo_upstream_server.conf"
  UTOO_SWITCH_SCRIPT: "/usr/local/sbin/utoo-switch-active.sh"
  # 兼容旧变量名
  UTOO_STATIC_C: "/var/www/utoo-web"
  UTOO_STATIC_ADMIN: "/var/www/utoo-web"

.utoo_windows_runner:
  tags:
    - utoo-windows

# $$ → 交给 PowerShell 的 $；'$CI_PROJECT_DIR' → GitLab 替换为真实仓库路径（单引号避免 \b 被 PowerShell 转义）
.utoo_run_deploy: &utoo_run_deploy |
  $$ErrorActionPreference = 'Stop'
  $$root = '$CI_PROJECT_DIR'
  if ([string]::IsNullOrWhiteSpace($$root)) { throw 'CI_PROJECT_DIR is empty after GitLab expansion' }
  $$root = $$root.Trim().TrimEnd('\')
  Write-Host ("[ci] project_dir={0}" -f $$root)
  Set-Location -LiteralPath $$root
  $$deployScript = Join-Path $$root 'deploy\utoo-windows\ci-deploy-windows.ps1'
  if (-not (Test-Path -LiteralPath $$deployScript)) {
    Write-Host ("[ci] cwd={0}" -f (Get-Location).Path)
    Get-ChildItem -Force -Name | Select-Object -First 40
    throw ("Missing deploy script: {0}" -f $$deployScript)
  }
  & $$deployScript

.utoo_run_frontend: &utoo_run_frontend |
  $$ErrorActionPreference = 'Stop'
  $$root = '$CI_PROJECT_DIR'
  if ([string]::IsNullOrWhiteSpace($$root)) { throw 'CI_PROJECT_DIR is empty after GitLab expansion' }
  $$root = $$root.Trim().TrimEnd('\')
  Write-Host ("[ci] project_dir={0}" -f $$root)
  Set-Location -LiteralPath $$root
  $$runScript = Join-Path $$root 'deploy\utoo-windows\ci-run-frontend.ps1'
  if (-not (Test-Path -LiteralPath $$runScript)) { throw ("Missing frontend runner: {0}" -f $$runScript) }
  & $$runScript

# --- dev：6 个独立发布入口 ---

deploy_order_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: service
    UTOO_DEPLOY_SERVICE: order
  when: manual
  allow_failure: false
  script:
    - *utoo_run_deploy

