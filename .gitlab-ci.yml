# .gitlab-ci.yml — UTOO 业务发版（P5 发版分家）
# Runner tag：utoo-windows（须 shell=powershell；禁止改成 bash）
#
# ========== P5 / 方案 B（强制）==========
# 本仓只发：utoo_gateway / utoo_biz / utoo-web-front
# 部署到现网同机槽：/opt/qd-mall-{blue|green} + /var/www/utoo-web
# 禁止发中台五件套（identity/order/payment/admin_asset/admin_platform）
# 中台唯一发版源：大平台仓 mall_qingdao_pydjango 的 platform/*
# 大平台前端 admin-web 由大平台仓发；本仓前端是 utoo-web-front（不是 admin-web）
# ==================================================
#
# 发版入口：ci-entry-*.cmd → powershell -File

stages:
  - deploy
  - deploy_all

variables:
  GIT_STRATEGY: fetch
  GIT_CLEAN_FLAGS: "-ffd"
  QD_MALL_UTOO_STATIC_WEB: "/var/www/utoo-web"
  QD_MALL_SHARED_CONFIG: "/opt/qd-mall/config"
  QD_MALL_UTOO_GATEWAY_UPSTREAM_CONF: "/usr/local/nginx/conf/utoo_upstream_server.conf"
  QD_MALL_UTOO_GATEWAY_SWITCH_SCRIPT: "/usr/local/sbin/qd-mall-switch-utoo-active.sh"
  QD_MALL_SERVICE_UPSTREAM_CONF_DIR: "/usr/local/nginx/conf"
  QD_MALL_SERVICE_SWITCH_SCRIPT: "/usr/local/sbin/qd-mall-switch-service.sh"
  # 兼容旧变量名
  UTOO_STATIC_WEB: "/var/www/utoo-web"
  CI_COMMIT_DESCRIPTION: "-"
  CI_COMMIT_MESSAGE: "-"

.utoo_windows_runner:
  tags:
    - utoo-windows
  variables:
    SSH_PRIVATE_KEY: ""
    SSH_PRIVATE_KEY_DEV: ""
    SSH_PRIVATE_KEY_PROD: ""
    CI_COMMIT_DESCRIPTION: "-"
    CI_COMMIT_MESSAGE: "-"

.utoo_run_deploy: &utoo_run_deploy
  - cmd.exe /c "$CI_PROJECT_DIR\\deploy\\utoo-windows\\ci-entry-deploy.cmd"

.utoo_run_frontend: &utoo_run_frontend
  - cmd.exe /c "$CI_PROJECT_DIR\\deploy\\utoo-windows\\ci-entry-utoo-frontend.cmd"

.utoo_run_all: &utoo_run_all
  - cmd.exe /c "$CI_PROJECT_DIR\\deploy\\utoo-windows\\ci-entry-all.cmd"

# --- P4 停发：中台五件套（保留定义便于审计）---

deploy_order_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only: [dev]
  except: [merge_requests]
  variables:
    QD_MALL_DEPLOY_TARGET: dev
    UTOO_DEPLOY_TARGET: dev
    QD_MALL_DEPLOY_PHASE: service
    QD_MALL_DEPLOY_SERVICE: order
  when: never
  allow_failure: true
  script: *utoo_run_deploy

