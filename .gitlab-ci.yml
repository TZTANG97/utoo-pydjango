# .gitlab-ci.yml — Utoo 微服务红绿双实例发版（与 EMKU 无关）
# Runner tag：utoo-windows（须为本项目单独注册，否则会 stuck）
#
# 每个环境：
# - stage deploy：6 个独立手动发布（order / payment / admin_asset / admin_platform / gateway / frontend）
# - stage deploy_all：1 个一键全发（写在单发后面，单独一列；needs:[] 不挡单发）
# 前四者按各自 upstream 的空闲蓝绿实例发布并切流；gateway 独立切公网入口。
#
# Runner（utoo-windows）已切 shell=cmd。
# 原因：PowerShell executor 把真实 CI_COMMIT_DESCRIPTION 写进生成的 .ps1；多行中文 / Co-authored-by <email>
# 会 ParserError，env（含 CI_PROJECT_DIR）注入失败；YAML 覆盖 CI_COMMIT_* 对 Runner 19 不生效。
# 入口走 cmd -> powershell -File，用 ERRORLEVEL 保证失败能红。
# 禁止复用 emku-windows /opt/emku-* / emku_upstream_*
# 约定：发版分支 commit 尽量单行标题、少写正文，避免特殊字符。
stages:
  - deploy
  - deploy_all

variables:
  GIT_STRATEGY: fetch
  GIT_CLEAN_FLAGS: "-ffd"
  UTOO_STATIC_WEB: "/var/www/utoo-web"
  UTOO_SHARED_CONFIG: "/opt/utoo/config"
  UTOO_UPSTREAM_CONF: "/usr/local/nginx/conf/utoo_upstream_server.conf"
  UTOO_SWITCH_SCRIPT: "/usr/local/sbin/utoo-switch-active.sh"
  # 兼容旧变量名
  UTOO_STATIC_C: "/var/www/utoo-web"
  UTOO_STATIC_ADMIN: "/var/www/utoo-web"

.utoo_windows_runner:
  tags:
    - utoo-windows

# cmd shell：用 %CI_PROJECT_DIR%（不要写 PowerShell $ 变量）
.utoo_run_deploy: &utoo_run_deploy
  - cmd.exe /c "%CI_PROJECT_DIR%\\deploy\\utoo-windows\\ci-entry-deploy.cmd"

.utoo_run_frontend: &utoo_run_frontend
  - cmd.exe /c "%CI_PROJECT_DIR%\\deploy\\utoo-windows\\ci-entry-frontend.cmd"

.utoo_run_all: &utoo_run_all
  - cmd.exe /c "%CI_PROJECT_DIR%\\deploy\\utoo-windows\\ci-entry-all.cmd"

# --- dev：先 6 个单发，再一键全发 ---

deploy_order_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: service
    UTOO_DEPLOY_SERVICE: order
  when: manual
  allow_failure: false
  script: *utoo_run_deploy

deploy_payment_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: service
    UTOO_DEPLOY_SERVICE: payment
  when: manual
  allow_failure: false
  script: *utoo_run_deploy

deploy_admin_asset_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: service
    UTOO_DEPLOY_SERVICE: admin_asset
  when: manual
  allow_failure: false
  script: *utoo_run_deploy

deploy_admin_platform_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: service
    UTOO_DEPLOY_SERVICE: admin_platform
  when: manual
  allow_failure: false
  script: *utoo_run_deploy

deploy_gateway_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: gateway
    UTOO_DEPLOY_SERVICE: gateway
  when: manual
  allow_failure: false
  script: *utoo_run_deploy

deploy_frontend_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: static
    UTOO_DEPLOY_SERVICE: frontend
  when: manual
  allow_failure: false
  script: *utoo_run_frontend

deploy_all_dev:
  extends: .utoo_windows_runner
  stage: deploy_all
  # 不依赖前面单发是否点过，否则会一直卡在 deploy stage
  needs: []
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
  when: manual
  allow_failure: false
  timeout: 2h
  script: *utoo_run_all

