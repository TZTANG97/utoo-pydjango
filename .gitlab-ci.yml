    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: service
    UTOO_DEPLOY_SERVICE: payment
  when: never
  allow_failure: false
  script: *utoo_run_deploy

deploy_admin_asset_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: service
    UTOO_DEPLOY_SERVICE: admin_asset
  when: never
  allow_failure: false
  script: *utoo_run_deploy

deploy_admin_platform_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: service
    UTOO_DEPLOY_SERVICE: admin_platform
  when: never
  allow_failure: false
  script: *utoo_run_deploy

deploy_gateway_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: gateway
    UTOO_DEPLOY_SERVICE: gateway
  when: manual
  allow_failure: false
  script: *utoo_run_deploy

deploy_frontend_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: static
    UTOO_DEPLOY_SERVICE: frontend
  when: manual
  allow_failure: false
  script: *utoo_run_frontend

deploy_all_dev:
  extends: .utoo_windows_runner
  stage: deploy_all
  # 不依赖前面单发是否点过，否则会一直卡在 deploy stage
  needs: []
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
  when: manual
  allow_failure: false
  timeout: 2h
  script: *utoo_run_all

