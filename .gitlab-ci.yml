# .gitlab-ci.yml — Utoo 微服务红绿双实例发版（与 EMKU 无关）
# Runner tag：utoo-windows（须为本项目单独注册，否则会 stuck）
#
# 每个环境：
# - stage deploy：6 个独立手动发布（order / payment / admin_asset / admin_platform / gateway / frontend）
# - stage deploy_all：1 个一键全发（写在单发后面，单独一列；needs:[] 不挡单发）
#
# 发版入口对齐工厂项目 factoryproductsystem2：
#   shell=bash + powershell.exe -File "$(pwd -W)/deploy/.../*.ps1"
#   勿用 $CI_PROJECT_DIR（Git Bash 下常缺盘符）；cwd 已是仓库根，pwd -W 取带盘符 Windows 路径。
# 禁止复用 emku-windows /opt/emku-* / emku_upstream_*
stages:
  - deploy
  - deploy_all

variables:
  GIT_STRATEGY: fetch
  GIT_CLEAN_FLAGS: "-ffd"
  UTOO_STATIC_WEB: "/var/www/utoo-web"
  UTOO_SHARED_CONFIG: "/opt/utoo/config"
  UTOO_UPSTREAM_CONF: "/usr/local/nginx/conf/utoo_upstream_server.conf"
  UTOO_SWITCH_SCRIPT: "/usr/local/sbin/utoo-switch-active.sh"
  # 兼容旧变量名
  UTOO_STATIC_C: "/var/www/utoo-web"
  UTOO_STATIC_ADMIN: "/var/www/utoo-web"

.utoo_windows_runner:
  tags:
    - utoo-windows

# 与工厂一致：bash 下用 pwd -W，再交给 Windows PowerShell -File
.utoo_run_deploy: &utoo_run_deploy
  - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$(pwd -W)/deploy/utoo-windows/ci-deploy-windows.ps1"

.utoo_run_frontend: &utoo_run_frontend
  - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$(pwd -W)/deploy/utoo-windows/ci-run-frontend.ps1"

.utoo_run_all: &utoo_run_all
  - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$(pwd -W)/deploy/utoo-windows/ci-run-all.ps1"

# --- dev：先 6 个单发，再一键全发 ---

deploy_order_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: service
    UTOO_DEPLOY_SERVICE: order
  when: manual
  allow_failure: false
  script: *utoo_run_deploy

deploy_payment_dev:
  extends: .utoo_windows_runner
  stage: deploy
  only:
    - dev
  except:
    - merge_requests
  variables:
    UTOO_DEPLOY_TARGET: dev
    UTOO_DEPLOY_PHASE: service
    UTOO_DEPLOY_SERVICE: payment
  when: manual
  allow_failure: false
  script: *utoo_run_deploy

deploy_admin_asset_dev:
  extends: .utoo_windows_runner
