<h1>交流 · Chroma 串口 / SCPI</h1>
<p>Chroma 交流源常用 VISA/SCPI 串口资源连接。在设备管理中选择对应串口页，填写资源名后连接。</p>
<ul>
  <li>资源名形如仪器管理器中看到的 VISA 字符串（按现场实际填写）。</li>
  <li>连接成功后再做输出/试验相关操作；不要与爱科 IP 页混填。</li>
</ul>
