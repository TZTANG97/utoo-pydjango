<h1>直流 · 蓝电（连接 + 模式 + 参数）</h1>
<p>蓝电不止填 IP。典型顺序：</p>
<ol>
  <li>填写 <strong>IP + 端口</strong> 并连接。</li>
  <li>选择工作模式：原始负载 / SAS / 电池模拟器，点「应用模式」。</li>
  <li>按模式填参数并「发送参数」：
    <ul>
      <li><strong>SAS</strong>：Pmpp_stc、Umpp_stc、填充因子等 →「发送参数到设备（曲线）」</li>
      <li><strong>原始负载</strong>：恒压/恒流/恒功率/恒阻 →「发送参数」</li>
    </ul>
  </li>
  <li>确认后再开输出（按试验流程）。</li>
</ol>
