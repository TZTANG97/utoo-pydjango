<h1>直流 · Chroma</h1>
<p>直流 Chroma 与交流类似：串口（VISA/SCPI）或 IP，按现场接线选择对应页。</p>
<ul>
  <li>光伏曲线试验常涉及 TABLE/IV 曲线模式；具体参数多在试验对话框的 DC 步骤配置。</li>
  <li>设备管理侧先保证「能连上、状态正常」。</li>
</ul>
